schema_version: 1

context:
  name: google-cloud-firestore
  version: "2.28.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 8211418bd746f3857046fc375138ddd0dfb023d5012545a9ade149be1461c6db

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.11.0,<3.0.0
    - google-api-core-grpc
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - google-cloud-core >=2.0.0,<3.0.0
    # more restrictive constraint for python >=3.14
    - grpcio >=1.75.1,<2.0.0
    # more restrictive constraint for python >=3.13
    - proto-plus >=1.25.0,<2.0.0
    - protobuf >=4.25.8,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.firestore
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Python Client for Google Cloud Firestore
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-firestore
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-firestore
  documentation: https://cloud.google.com/products/firestore

extra:
  recipe-maintainers:
    - xylar
    - mitchellsuter
