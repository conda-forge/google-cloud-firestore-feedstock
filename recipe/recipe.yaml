schema_version: 1

context:
  name: google-cloud-firestore
  version: "2.29.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 605a8463959da450531b09b60d4093c427d063e8880a38ed36f9bc02adc8ab99

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.25.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - google-cloud-core >=2.0.0,<3.0.0
    # tightest of upstream's floors (python >=3.14)
    - grpcio >=1.75.1,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.firestore
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Python Client for Google Cloud Firestore
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-firestore
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-firestore
  documentation: https://cloud.google.com/products/firestore

extra:
  recipe-maintainers:
    - xylar
    - mitchellsuter
